<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrameCue · 現場製作工作台</title>
<style>
:root{color-scheme:dark;--bg:#101214;--panel:#191c1f;--line:#30353a;--ink:#f4f4ef;--muted:#aab1b7;--lime:#d7ff64}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}a{color:inherit;text-decoration:none}header,footer{border-block-end:1px solid var(--line);padding:18px max(5vw,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header a{font-weight:850;letter-spacing:-.04em;font-size:24px}header a span,.accent{color:var(--lime)}small,.muted{color:var(--muted)}main{max-width:1160px;margin:auto;padding:clamp(24px,5vw,64px) 24px}.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(105deg,#202622 18%,#131914 100%);padding:clamp(28px,6vw,72px);border:1px solid #404c36;border-radius:22px}.hero svg{position:absolute;z-index:-1;right:-80px;top:0;width:min(70%,670px);height:100%;opacity:.38}.hero h1{font-size:clamp(42px,8vw,91px);letter-spacing:-.075em;line-height:1.05;margin:20px 0}.tag{font:700 12px monospace;letter-spacing:.15em;color:var(--lime)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.card:hover{border-color:var(--lime)}h2{margin-bottom:8px}.card p{color:var(--muted);min-height:52px}.button,button,input,select{font:inherit;border-radius:8px;padding:9px 13px;border:1px solid var(--line);background:#23272b;color:var(--ink)}button,.button{cursor:pointer;display:inline-block}.primary{background:var(--lime);color:#141a09;font-weight:800}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.bar>*{max-width:100%}.clock{font:clamp(30px,7vw,64px) monospace;font-variant-numeric:tabular-nums}.readout{display:grid;gap:12px;margin:16px 0}.current{background:var(--lime);color:#161d0c;border-radius:16px;padding:22px}.next{border:1px solid var(--line);border-radius:16px;padding:22px}.current strong,.next strong{display:block;overflow-wrap:anywhere;font-size:clamp(34px,7vw,78px);line-height:1.18}.next strong{font-size:clamp(26px,5vw,52px)}.table{overflow:auto;margin-top:14px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;border-bottom:1px solid var(--line);padding:9px}td input{width:120px}td input[data-key=note]{width:220px}input[type=range],audio{width:100%}label{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}footer{border-block-start:1px solid var(--line);border-block-end:0;font-size:13px;color:var(--muted)}@media(max-width:560px){header,footer{padding:14px}.hero svg{width:95%;opacity:.2}main{padding-inline:14px}}
.lyrics{position:relative;max-height:45vh;overflow:auto;list-style:none;padding:0;margin:0}.lyrics li{display:grid;grid-template-columns:4em 1fr;gap:12px;padding:10px;border-bottom:1px solid var(--line)}.lyrics li[aria-current]{background:#333c22;border-left:3px solid var(--lime)}.lyrics time{font-family:monospace}.lyrics strong,.lyrics small,.lyrics .lyric{display:block}.lyric{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.1rem}.lyrics li:last-child{margin-bottom:40vh}textarea{background:#23272b;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;width:210px;padding:8px}</style>
<header><a href="#">Frame<span>Cue</span></a><small>現場製作工作台</small></header>
<main id="app"></main>
<footer><span>FRAMECUE / SHOW PRODUCTION</span><span>FRAMECUE</span></footer>
<script type="module">
const rows=Object.fromEntries(['motion','shots'].map(key=>{
 try{return [key,JSON.parse(localStorage.getItem('framecue-project-'+key))||[]]}
 catch{return [key,[]]}
}));
const audio=new Audio();
let duration=0, anchor=0, stamp=0, running=false, media=false, remote=null, notice='';
const channel=new BroadcastChannel('framecue-preview');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{const ms=Math.round(Math.max(0,t)*1000);return [Math.floor(ms/60000),Math.floor(ms/1000)%60].map(x=>String(x).padStart(2,'0')).join(':')+'.'+String(ms%1000).padStart(3,'0')};
const route=()=>location.hash.slice(1);
const now=()=>Math.min(duration,media&&route()==='motion'?audio.currentTime:anchor+(running?(performance.now()-stamp)/1000:0));
const sorted=key=>rows[key].filter(r=>Number.isFinite(r.t)&&r.t>=0&&(r.name.trim()||(key==='motion'&&r.section))).slice().sort((a,b)=>a.t-b.t);
function sync(){channel.postMessage({t:now(),playing:running,at:(performance.timeOrigin+performance.now()),duration,rows:sorted('motion')})}
channel.onmessage=({data})=>{remote=data};
setInterval(()=>{if(route()==='motion')sync()},100);
function showDuration(){return Math.max(0,...sorted('shots').map(r=>r.t+1))}
function save(key){localStorage.setItem('framecue-project-'+key,JSON.stringify(rows[key]))}
function pause(){anchor=now();running=false;audio.pause()}
function seek(t){anchor=Math.max(0,Math.min(duration,t));stamp=performance.now();if(media&&route()==='motion')audio.currentTime=anchor}
function validation(key){
 const counts=new Map();
 for(const r of rows[key]) counts.set(r.t,(counts.get(r.t)||0)+1);
 return rows[key].flatMap((r,i)=>{
  const issues=[];
  if(!Number.isFinite(r.t)||r.t<0)issues.push('時間格式有誤');
  else {if(key==='motion'&&media&&r.t>duration)issues.push('超出音樂長度');if(counts.get(r.t)>1)issues.push('時間重複');if(i&&r.t<rows[key][i-1].t)issues.push('時間順序倒退')}
  if(!r.name.trim()&&!r.section)issues.push('缺少名稱');
  if(!Number.isFinite(r.lead)||r.lead<0)issues.push('預告秒數無效');
  return issues.length?['第 '+(i+1)+' 列 '+issues.join('、')]:[];
 });
}
function home(){return `<section class="hero"><svg viewBox="0 0 600 300" aria-hidden="true"><defs><pattern id="mesh" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a2b579" stroke-opacity=".32"/></pattern></defs><rect width="600" height="300" fill="url(#mesh)"/><path d="M0 205H100l22-22 18 44 27-89 21 98 25-51 22 20h365" fill="none" stroke="#d7ff64" stroke-width="2"/><circle cx="385" cy="150" r="89" fill="none" stroke="#b9dd6f"/><circle cx="385" cy="150" r="59" fill="none" stroke="#b9dd6f"/><path d="M385 47v30m0 146v30m-103-103h30m146 0h30" stroke="#d7ff64" stroke-width="2"/></svg><div class="tag">PRODUCTION WORKSPACE / 01</div><h1>現場製作<br>工作台</h1><p>從排鏡到開拍，把每個時間點的指令放在一起。</p><a class="button primary" href="#motion">開啟運鏡提示器 ↗</a></section><h2>選擇工具</h2><section class="grid">${[['01','運鏡提示器','匯入分配表，跟著音樂提示現在、下一位和移動方向。','motion'],['02','多機鏡位編排','事先排定時間、切換機位與構圖指令。','shots'],['03','現場導播 Run Show','跟著時間軸或按 GO，查看目前和下一鏡。','run']].map(([n,t,d,id])=>`<a class="card" href="#${id}"><div class="tag">${n} / TOOL</div><h2>${t}</h2><p>${d}</p><span class="accent">開啟工具 ↗</span></a>`).join('')}</section>`}
function editor(key){return `<section class="panel"><h2>${key==='motion'?'歌詞分配與走位':'鏡位時間軸'}</h2><div class="bar"><button id="add">＋ 新增 cue</button>${key==='motion'?'<label>匯入 CSV <input id="csv" type="file" accept=".csv,text/csv"></label>':'<a class="button primary" href="#run">進入 Run Show ↗</a>'}</div><p class="muted" id="validate"></p><div class="table"><table><thead><tr><th>時間（秒）</th>${key==='motion'?'<th>段落</th>':''}<th>${key==='motion'?'開口者／段落':'攝影機'}</th>${key==='motion'?'<th>歌詞</th>':''}<th>拍攝指令</th><th>提前（秒）</th><th></th></tr></thead><tbody>${rows[key].map((r,i)=>`<tr>${(key==='motion'?['t','section','name','lyric','note','lead']:['t','name','note','lead']).map(k=>`<td><${k==='lyric'?'textarea':'input'} aria-label="${({t:'時間',section:'段落',lyric:'歌詞',name:'名稱',note:'拍攝指令',lead:'提前秒數'})[k]}，第 ${i+1} 列" data-row="${i}" data-key="${k}" ${k==='lyric'?'>'+esc(r[k])+'</textarea>':'value="'+esc(r[k])+'">'}</td>`).join('')}<td><button data-jump="${i}">定位</button> <button data-delete="${i}" aria-label="刪除第 ${i+1} 列">×</button></td></tr>`).join('')}</tbody></table></div></section>`}
function transport(key){return `<section class="panel"><div class="tag">${key==='motion'?'MUSIC MASTER':'SHOW TRANSPORT'}</div><div class="clock" id="clock"></div><input aria-label="播放進度" id="seek" type="range" min="0" step=".001"><div class="bar"><button class="primary" id="play">播放</button><button id="reset">回起點</button>${key==='motion'?'<a class="button" href="https://drive.google.com/file/d/1gHtq7jCHVTjz5ggUtVBYexseak8Trf8U/view" target="_blank" rel="noopener">取得 Show70 參考音檔 ↗</a><label>載入音樂 <input id="audio" type="file" accept="audio/*,.wav"></label><a class="button" href="#monitor" target="_blank" rel="noopener">開啟攝影提示端 ↗</a>':route()==='run'?'<button id="go">GO 下一鏡</button>':''}</div><small id="media-label"></small></section>`}
function readout(){return '<div class="readout" id="readout"></div>'+(['motion','monitor'].includes(route())?'<section class="panel"><h2>歌詞分配</h2><ol id="lyrics" class="lyrics" aria-label="歌詞分配"></ol></section>':'')}
function paintLyrics(list,current){
 const el=document.querySelector('#lyrics');if(!el)return;
 const content=JSON.stringify(list);
 if(el.dataset.content!==content){
  el.dataset.content=content;delete el.dataset.active;
  el.innerHTML=list.map(r=>`<li><time>${fmt(r.t).replace(/\.000$/,'')}</time><span><small>${esc(r.section)}</small><strong>${esc(r.name||'無演唱')}</strong><span class="lyric">${esc(r.lyric||'—')}</span></span></li>`).join('');
 }
 const index=list.indexOf(current);
 if(el.dataset.active===String(index))return;
 el.dataset.active=index;
 el.querySelector('[aria-current]')?.removeAttribute('aria-current');
 const row=el.children[index];
 if(row){
  row.setAttribute('aria-current','true');
  el.scrollTop=row.offsetTop-el.offsetTop;
 }else el.scrollTop=0;
}
function render(){
 const page=route();const key=page==='motion'?'motion':'shots';
 if(page!=='monitor')duration=page==='motion'?(media?audio.duration:0):showDuration();
 if(!['motion','shots','run','monitor'].includes(page)){app.innerHTML=home();return}
 const titles={motion:'運鏡提示器',shots:'多機鏡位編排',run:'現場導播 Run Show',monitor:'攝影提示端'};
 const desc={motion:'主控端 · 匯入歌詞分配表及伴奏，排定拍攝提示',shots:'為每個時間點指定攝影機、拍攝對象與景別',run:'跟著時間軸提示切鏡，也能手動按 GO',monitor:'跟隨同一瀏覽器內開啟的音樂主控端'};
 app.innerHTML=`<a class="muted" href="#">← 工具首頁</a><h1>${titles[page]}</h1><p class="muted">${desc[page]}</p>`+(page==='monitor'?'<div class="clock" id="clock"></div>'+readout():transport(key)+(page!=='shots'?readout():'')+(page==='run'?'':editor(key)));
 if(page==='monitor'){paint();return}
 document.querySelector('#play').onclick=async()=>{
  if(running){pause();if(page==='motion')sync();return}
  if(now()>=duration)seek(0);
  if(media&&page==='motion'){try{await audio.play()}catch{notice='無法播放這個音檔';paint();return}}
  stamp=performance.now();running=true;if(page==='motion')sync();
 };
 document.querySelector('#seek').oninput=e=>{seek(+e.target.value);if(page==='motion')sync()};
 document.querySelector('#reset').onclick=()=>{pause();seek(0)};
 const go=document.querySelector('#go');
 if(go)go.onclick=()=>{const next=sorted('shots').find(r=>r.t>now()+.001);if(next){pause();seek(next.t)}};
 if(page!=='run'){
  document.querySelector('#add').onclick=()=>{rows[key].push({t:+now().toFixed(3),name:'',note:'',lead:3});save(key);render();app.querySelector('tbody tr:last-child input[data-key=name]').focus()};
  for(const input of app.querySelectorAll('[data-key]'))input.onchange=()=>{const k=input.dataset.key;rows[key][input.dataset.row][k]=k==='t'?parseTime(input.value):k==='lead'?(input.value.trim()?Number(input.value):null):input.value;save(key);paint()};
  for(const button of app.querySelectorAll('[data-delete]'))button.onclick=()=>{rows[key].splice(+button.dataset.delete,1);save(key);render()};
  for(const button of app.querySelectorAll('[data-jump]'))button.onclick=()=>{const t=rows[key][button.dataset.jump].t;if(Number.isFinite(t)){seek(t);if(page==='motion')sync()}};
 }
 if(page==='motion')bindFiles();
 paint();
}
function parseTime(value){
 const s=value.trim(),parts=s.split(':');
 if(!/^\d+(?::[0-5]?\d)?(?:\.\d+)?$/.test(s))return null;
 return parts.length===2?Number(parts[0])*60+Number(parts[1]):Number(s);
}
function csvRows(source){
 const result=[];let row=[],field='',quoted=false;
 for(let i=0;i<source.length;i++){
  const c=source[i];
  if(c==='"'){if(quoted&&source[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(!quoted&&c===','){row.push(field);field=''}
  else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&source[i+1]==='\n')i++;row.push(field);result.push(row);row=[];field=''}
  else field+=c;
 }
 if(quoted)throw Error('CSV 引號未關閉');
 row.push(field);result.push(row);
 return result.filter(r=>r.some(v=>v.trim()));
}
let audioURL='';
function bindFiles(){
 document.querySelector('#audio').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  pause();media=false;duration=0;seek(0);if(audioURL)URL.revokeObjectURL(audioURL);
  audioURL=URL.createObjectURL(file);audio.src=audioURL;notice='正在讀取音樂…';
  audio.onloadedmetadata=()=>{if(!Number.isFinite(audio.duration)){notice='無法取得音樂長度';return}media=true;notice=file.name;if(route()==='motion'){duration=audio.duration;seek(0);paint()}};
  audio.onerror=()=>{media=false;duration=0;seek(0);notice='音檔讀取失敗，請重新選擇音檔';paint()};
 };
 document.querySelector('#csv').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
   const [header,...data]=csvRows((await file.text()).replace(/^\uFEFF/,''));
   const columns=header?.map(v=>v.trim())||[];
   const artist=columns.includes('藝人')?'藝人':'開口者';
   if(!columns.includes('時間')||!columns.includes(artist)||!data.length)throw Error('CSV 需要時間與藝人欄，並至少有一筆資料');
   rows.motion=data.map(row=>{
    const get=label=>row[columns.indexOf(label)]||'';
    const name=get(artist);
    return {t:parseTime(get('時間')),section:get('段落'),name:name==='-'?'':name,lyric:get('歌詞'),note:get('拍攝指令'),lead:get('提前秒數').trim()?Number(get('提前秒數')):2};
   });
   save('motion');notice='已匯入 '+data.length+' 筆 cue';render();sync();
  }catch(error){notice=error.message;paint()}
 };

}
function paint(){
 const clock=document.querySelector('#clock');if(!clock)return;
 const page=route(),monitor=page==='monitor',connected=remote&&(performance.timeOrigin+performance.now())-remote.at<2000;
 if(!monitor&&running&&now()>=duration-.001)pause();
 const t=monitor?(connected?Math.min(remote.duration,remote.t+(remote.playing?Math.max(0,(performance.timeOrigin+performance.now())-remote.at)/1000:0)):0):now();
 clock.textContent=fmt(t);
 const list=monitor?(connected?remote.rows:[]):sorted(page==='motion'?'motion':'shots');
 let current,next;
 for(const row of list){if(row.t<=t)current=row;else{next=row;break}}
 paintLyrics(list,current);
 const count=next?Math.max(0,next.t-t):0;
 const view=document.querySelector('#readout');
 if(view){
  const html=`<section class="current"><div>${monitor&&!connected?'連線狀態':'現在'}</div><strong>${esc(monitor&&!connected?'等待主控端':(current?(current.name||current.section):'待命'))}</strong><div class="lyric">${esc(current?.lyric)}</div><div>${esc(current?.note||'')}</div></section><section class="next"><div class="accent">${next&&count<=next.lead?'準備移動':'下一條'} ${next?'／ '+count.toFixed(3)+' 秒':''}</div><strong>${esc(next?.name||next?.section||'—')}</strong><div class="lyric">${esc(next?.lyric)}</div><div>${esc(next?.note||'')}</div></section>`;
  if(view.dataset.markup!==html){view.innerHTML=html;view.dataset.markup=html}
 }
 if(monitor)return;
 const seekbar=document.querySelector('#seek');seekbar.max=duration;if(document.activeElement!==seekbar)seekbar.value=t;
 const play=document.querySelector('#play');
 play.disabled=page==='motion'?!media:!duration;
 play.textContent=running?'暫停':page==='motion'?'播放音樂':'開始計時';
 document.querySelector('#media-label').textContent=page==='motion'?[notice,media?'音樂長度 '+fmt(duration):'請載入音樂以開始播放'].filter(Boolean).join(' · '):'流程長度 '+fmt(duration);
 const check=document.querySelector('#validate');
 if(check){
  const key=page==='motion'?'motion':'shots';
  if(page==='shots')duration=showDuration();
  const issues=validation(key);
  check.textContent=issues.length?issues.join(' ／ '):!rows[key].length?(key==='motion'?'請匯入 CSV 或新增 cue':'請新增鏡位 cue'):key==='motion'&&!media?'載入音樂後核對時間範圍':'時間檢查通過';
 }

}
window.addEventListener('hashchange',()=>{pause();seek(0);render()});
render();requestAnimationFrame(function frame(){paint();requestAnimationFrame(frame)});
</script>
</html>
