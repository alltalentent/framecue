 minmax(4em,1.5fr);gap:6px;padding-inline:5px;font-size:.82rem}.lyrics .lyric{font-size:inherit}}button[aria-pressed=true]{background:var(--brand);color:var(--bg)}.lyrics::before,.lyrics::after{content:"";display:block;height:50%}.lyrics li:last-child{margin-bottom:0}.operator{position:fixed;inset:0;z-index:5;max-width:none;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding:8px max(12px,env(safe-area-inset-right))}.operator h1{font-size:1rem;margin:2px 0}.operator>p{display:none}.operator .clock{font-size:clamp(20px,5vw,38px)}.operator .panel{padding:8px 10px}.operator .panel:last-child{flex:1;min-height:0;display:flex;flex-direction:column}.operator .panel:last-child h2,.operator #cue-now{display:none}.operator .lyrics{flex:1;max-height:none;min-height:0}.operator .bar{margin:3px 0}.operator button,.operator .button{padding:4px 8px}@media(max-height:520px){.operator .tag,.operator #media-label{display:none}.operator h1{display:none}}dialog{max-width:min(540px,94vw);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px}dialog label{display:grid;gap:5px;margin:10px 0}dialog textarea{width:100%}dialog::backdrop{background:#0009}.lyrics button.cue-note{text-align:left;padding:0;background:transparent;border:0;font-size:inherit;color:inherit;min-width:0}.tool-list{gap:20px}.tool-row{background:linear-gradient(145deg,#1a2936,var(--panel) 70%);border-radius:18px}.tool-row .accent{font-size:1.4rem}.operator{background:radial-gradient(ellipse at top,#172c3d,var(--bg) 60%)}.operator .panel:last-child{border-color:#33485a;background:#111b25}.operator .lyrics li{align-items:center;min-height:54px}.operator .lyrics li>strong{font-size:clamp(1rem,4vw,1.55rem);line-height:1.2;overflow-wrap:anywhere}.operator .lyrics li[aria-current]{background:linear-gradient(90deg,#244457,#192b39);box-shadow:inset 0 0 0 1px #385b70}.operator .cue-columns{font-weight:700}.monitor-controls button{min-height:38px}.operator.focus-view> /* Compact display transport, shared by normal and full-screen viewing. */
#app.operator:has(.monitor-transport)>a,#app.operator:has(.monitor-transport)>h1{display:none}
.monitor-utility{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.monitor-utility>a{margin-right:auto;font-size:.85rem}
.monitor-transport{padding:10px 14px;background:#142431;border:1px solid #33485a;border-radius:12px;margin-bottom:8px;flex-shrink:0}
.monitor-transport-main{display:flex;align-items:center;justify-content:flex-start;gap:20px;flex-wrap:wrap}
.operator .monitor-transport .clock{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0;font-variant-numeric:tabular-nums}
.monitor-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.monitor-transport #monitor-status{display:block;font-size:.75rem;margin-top:6px;overflow-wrap:anywhere}
.operator.focus-view .monitor-utility,.operator:fullscreen .monitor-utility{display:none}
.operator.focus-view,.operator:fullscreen{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
.tool-row:is(button){color:inherit;text-align:left;font:inherit;cursor:pointer;width:100%}
@media(max-width:600px){.tool-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tool-row{min-height:108px;padding:12px 8px}.tool-row h3{font-size:1rem}.monitor-transport{padding:8px}.monitor-transport-main{gap:8px}.monitor-controls{gap:4px}.monitor-controls button{font-size:.8rem}.monitor-utility{margin-bottom:6px}}
.monitor-progress{display:flex;align-items:center;gap:10px;margin-top:8px;min-width:0}.monitor-progress span{font:12px monospace;white-space:nowrap;color:var(--muted)}.monitor-progress input{flex:1;min-width:0;width:100%;margin:0;accent-color:var(--brand);touch-action:pan-y}

/* Range controls must not inherit text-input padding or borders. */
input[type=range]{--seek-fill:10px;-webkit-appearance:none;appearance:none;display:block;height:32px;padding:0;border:0;border-radius:0;margin:0;background:transparent;cursor:pointer;direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:6px;border:0;border-radius:999px;background:linear-gradient(to right,var(--brand) 0 var(--seek-fill),#3b4a56 var(--seek-fill) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-7px;border:2px solid #e3f5fc;border-radius:50%;background:var(--brand);box-shadow:0 1px 5px #0006}
input[type=range]::-moz-range-track{height:6px;border:0;border-radius:999px;background:#3b4a56}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:var(--brand)}
input[type=range]::-moz-range-thumb{box-sizing:border-box;width:20px;height:20px;border:2px solid #e3f5fc;border-radius:50%;background:var(--brand)}
input[type=range]:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
input[type=range]:disabled{opacity:.45;cursor:default}
.monitor-progress{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px}
.monitor-progress input{grid-column:1 / -1;grid-row:1;width:100%}
.monitor-progress #remote-position{grid-column:1;grid-row:2;padding-left:10px}
.monitor-progress #remote-duration{grid-column:2;grid-row:2;padding-right:10px;text-align:right}

.operator.focus-view #monitor-status,.operator:fullscreen #monitor-status,.operator.focus-view .monitor-progress,.operator:fullscreen .monitor-progress,.operator.focus-view .rehearsal-tools,.operator:fullscreen .rehearsal-tools{display:none}
.rehearsal-tools{padding:8px 0;font-size:.85rem}.rehearsal-tools summary{cursor:pointer;color:var(--brand)}.rehearsal-tools input[type=number]{width:105px;padding:5px}.reader-settings label{display:flex;justify-content:space-between;gap:12px}.reader-settings input,.reader-settings select{max-width:180px}.operator .cue-columns,.operator .lyrics li{grid-template-columns:minmax(3em,var(--person-width,1fr)) minmax(5.7em,1fr) minmax(5em,var(--lyric-width,3fr)) minmax(4em,var(--note-width,2fr))}.operator .lyrics li>strong{font-size:var(--person-size,clamp(1rem,4vw,1.55rem))}.operator .lyrics .lyric{font-size:var(--lyric-size,1rem)}.operator .lyrics .cue-note{font-size:var(--note-size,1rem)}.lyrics li.reader-match{box-shadow:inset 3px 0 var(--brand)}.lyrics li.reader-dim{opacity:.45}
.lyrics button.cue-note{display:block;min-height:32px;width:100%}.project-trash{margin-top:12px}.project-trash>summary{cursor:pointer;color:var(--muted)}

function parseTime(value){
 const s=value.trim(),parts=s.split(':');
 if(!/^-?\d+(?::[0-5]?\d)?(?:\.\d+)?$/.test(s))return null;
 return parts.length===2?(s.startsWith('-')?-1:1)*(Math.abs(Number(parts[0]))*60+Number(parts[1])):Number(s);
}
function csvRows(source){
 const result=[];let row=[],field='',quoted=false;
 for(let i=0;i<source.length;i++){
  const c=source[i];
  if(c==='"'){if(quoted&&source[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(!quoted&&c===','){row.push(field);field=''}
  else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&source[i+1]==='\n')i++;row.push(field);result.push(row);row=[];field=''}
  else field+=c;
 }
 if(quoted)throw Error('CSV 引號未關閉');
 row.push(field);result.push(row);
 return result.filter(r=>r.some(v=>v.trim()));
}

  const lyric=normalize(row.lyric||'');
  if(lyric.length<4||!Number.isFinite(row.t)){last=Math.max(last,row.t||0);continue}

  const candidates=[];
  for(let at=transcript.indexOf(prefix);at>=0;at=transcript.indexOf(prefix,at+1)){
   const time=starts[at];
   if(Number.isFinite(time)&&time>last&&time<=duration&&Math.abs(time-row.t)<=15)candidates.push(time);
  }
  if(!candidates.length&&prefix.length>=8){
   // Allow one recognition substitution in the opening phrase.
   for(let at=0;at<=transcript.length-prefix.length;at++){

   }
  }

}

 if(monitor){const button=document.createElement('button');button.textContent='閱讀設定';button.onclick=readerDialog;app.querySelector('.monitor-utility').append(button)}
 if(!monitor&&!master)return;
 const box=document.createElement('details');box.className='rehearsal-tools';
 box.innerHTML='<summary data-ab-summary>段落循環 A／B</summary><div class="bar"><label>A 起點（秒）<input type="number" min="0" step=".1" data-ab="start"></label><button data-mark-ab="start">取目前 A</button><label>B 終點（秒）<input type="number" min="0" step=".1" data-ab="end"></label><button data-mark-ab="end">取目前 B</button><button data-ab-toggle aria-pressed="false">開啟段落循環</button></div><output role="status"></output>';
 box.oninput=()=>{box.dataset.dirty='true'};
 const chosen=monitor?remote?.segment:segment;
 box.querySelector('[data-ab=start]').value=chosen?.start||0;box.querySelector('[data-ab=end]').value=chosen?.end||0;
 for(const button of box.querySelectorAll('[data-mark-ab]'))button.onclick=()=>{box.dataset.dirty='true';box.querySelector('[data-ab='+button.dataset.markAb+']').value=(monitor?monitorTime:now()).toFixed(3)};
 const apply=enabled=>{
  const start=Number(box.querySelector('[data-ab=start]').value),end=Number(box.querySelector('[data-ab=end]').value),limit=monitor?remote?.duration:duration;
  if(enabled&&(!(end-start>=.1)||start<0||end>limit)){box.querySelector('output').textContent='B 必須晚於 A，且兩者需在音樂範圍內。';return}
  const config=enabled?{start,end,enabled}:{start:0,end:limit||0,enabled:false};
  if(monitor){if(!remote||clockMs()-remote.at>=2000){box.querySelector('output').textContent='請先連接控制端';return}sendRemote({transport:'segment',segment:config})}
  else{setSegment(config);sync();saveProjectQuietly()}
  box.querySelector('output').textContent=enabled?(monitor?'已送出段落循環 ':'已設定段落循環 ')+fmt(start)+' → '+fmt(end):'已關閉段落循環';
 };
 box.querySelector('[data-ab-toggle]').onclick=()=>apply(!(monitor?remote?.segment:segment)?.enabled);
 (monitor?app.querySelector('.monitor-transport'):app.querySelector('.panel')).append(box);
 if(master&&motionStep==='live'){
  const history=document.createElement('button');history.textContent='歷史版本';history.onclick=versionDialog;document.querySelector('#project-save').after(history);
 }
}
function readerDialog(){
 const dialog=document.createElement('dialog');dialog.className='reader-settings';
 dialog.innerHTML='<form method="dialog"><h2>閱讀設定</h2><label>整體字級（%）<input data-setting="scale" type="number" min="75" max="150" step="5" value="'+reader.scale+'"></label>'+[['person','人名字級'],['lyric','歌詞字級'],['note','運鏡說明字級']].map(([key,label])=>'<label>'+label+'<input data-setting="'+key+'" type="number" min="12" max="48" value="'+reader[key]+'"></label>').join('')+[['personWidth','人名欄寬'],['lyricWidth','歌詞欄寬'],['noteWidth','運鏡欄寬']].map(([key,label])=>'<label>'+label+'<input data-setting="'+key+'" type="number" min=".5" max="6" step=".5" value="'+reader[key]+'"></label>').join('')+'<label>突顯人員<select id="reader-focus"><option value="">全部人員</option></select></label><p class="muted">設定儲存在此裝置，調整時即時預覽。</p><button>完成</button></form>';
 const select=dialog.querySelector('select');for(const name of [...new Set((remote?.rows||rows.motion).map(r=>r.name).filter(Boolean))])select.add(new Option(name,name));select.value=reader.focus;
 const apply=()=>{for(const input of dialog.querySelectorAll('[data-setting]')){const value=Number(input.value);if(input.validity.valid&&value>0)reader[input.dataset.setting]=value}reader.focus=select.value;localStorage.setItem('framecue-reader-v2',JSON.stringify(reader));for(const name of ['person','lyric','note']){app.style.setProperty('--'+name+'-size',reader[name]*reader.scale/100+'px');app.style.setProperty('--'+name+'-width',reader[name+'Width']+'fr')}const lyrics=document.querySelector('#lyrics');if(lyrics){delete lyrics.dataset.content;delete lyrics.dataset.active}paint()};
 dialog.oninput=apply;dialog.onchange=apply;dialog.onclose=()=>dialog.remove();document.body.append(dialog);dialog.showModal();
}
async function versionDialog(){
 const status=document.querySelector('#project-status');
 if(!projectId||!cloudUser){status.textContent='請先將專案儲存至雲端。';return}
 const id=projectId,user=cloudUser.id;
 try{
  const {data,error}=await cloudClient.storage.from('framecue-audio').list(user+'/'+id+'/versions',{limit:30,sortBy:{column:'name',order:'desc'}});if(error)throw error;
  if(!data.length){status.textContent='尚無歷史版本；下次修改並儲存後會保留前一版。';return}
  const dialog=document.createElement('dialog');dialog.innerHTML='<form method="dialog"><h2>復原歷史版本</h2><p>復原後先在此裝置檢視，儲存後才更新雲端。</p><select></select><div class="bar"><button value="cancel">取消</button><button value="restore">載入版本</button></div></form>';
  const select=dialog.querySelector('select');data.forEach((file,i)=>select.add(new Option(new Date(Number(file.name.split('-')[0])).toLocaleString('zh-TW'),i)));
  dialog.onclose=async()=>{
   if(dialog.returnValue==='restore')try{
    const file=data[Number(select.value)];const response=await cloudClient.storage.from('framecue-audio').download(user+'/'+id+'/versions/'+file.name);if(response.error)throw response.error;
    const version=decodeProject(JSON.parse(await response.data.text()));
    const latest=await cloudClient.from('framecue_projects').select('updated_at').eq('id',id).single();if(latest.error)throw latest.error;
    version.cloud=true;version.updated_at=latest.data.updated_at;version.audio=version.audio_url;
    if(version.audio_path){const download=await cloudClient.storage.from('framecue-audio').download(version.audio_path);if(download.error)throw download.error;version.audio=new File([download.data],version.name,{type:download.data.type});cloudAudio.set(id,{source:version.audio,path:version.audio_path})}
    pause();motionStep='upload';render();restoreProject(version);
   }catch(error){if(status.isConnected)status.textContent='版本載入失敗 · '+error.message}
   dialog.remove();
  };document.body.append(dialog);dialog.showModal();
 }catch(error){status.textContent='歷史版本讀取失敗 · '+error.message}
}
audio.addEventListener('timeupdate',()=>{if(route()==='motion'&&segment.enabled&&!audio.paused&&audio.currentTime>=segment.end){seek(segment.start);sync()}});
audio.addEventListener('ended',()=>{if(route()==='motion'&&segment.enabled){seek(segment.start);controlPlayback('play')}});
setInterval(()=>{
 if(!['monitor','run-monitor'].includes(route())||!remote||clockMs()-remote.at>2000)return;
 const ping=crypto.randomUUID(),t0=clockMs();pendingPings.set(ping,{t0});for(const [key,value] of pendingPings)if(t0-value.t0>10000)pendingPings.delete(key);
 const probe={ping,viewer:controllerId,target:remote.controllerId};channel.postMessage(probe);sendCloud(probe);
},2000);
const sharedCues=new URLSearchParams(location.hash.split('?')[1]).get('cues');
if(route()==='motion'&&sharedCues){
 try{
  const project=JSON.parse(sharedCues);
  if(Array.isArray(project)&&project.length&&project.every(row=>row&&typeof row.name==='string'&&Number.isFinite(row.t))){
   rows.motion=project;
   notice='已載入手機提示清單，請選擇音檔後進入提示器。';
  }
 }catch{}
}
window.addEventListener('hashchange',()=>{pause();seek(0);remote=null;monitorTime=0;monitorEpoch=undefined;previousRemoteTime=0;if(route()!=='motion')motionStep='upload';render()});
render();initCloud();requestAnimationFrame(function frame(){paint();requestAnimationFrame(frame)});
</script>
</html>
